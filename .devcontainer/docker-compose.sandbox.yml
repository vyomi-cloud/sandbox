# Vyomi Cloud Sandbox — aws-core + Docker compute.
#
# A trimmed, PULL-ONLY derivation of docker-compose.cloudlite.yml carrying the
# aws-core backends PLUS real EC2 compute (Docker backend):
#   s3            → MinIO
#   dynamodb      → dynamodb-local
#   sqs           → ElasticMQ
#   kms + secrets → Vault (dev mode)
#   rds           → Postgres
#   sns, iam      → in-process (no backend)
#   ec2           → sibling Docker containers via the Codespace's docker-in-docker
# Everything runs inside the Codespace's docker-in-docker daemon; port 9000 is
# forwarded to the *.app.github.dev URL. Unlicensed = Free tier (1 VM + 1 RDS +
# 1 bucket per space — enough to smoke-test S3 + RDS + EC2); activate Pro for
# more. See plan wise-orbiting-alpaca.md §3.1-§3.2.
name: vyomi-sandbox

networks:
  vyomi-net:
    name: vyomi-net

services:
  simulator:
    image: ${VYOMI_SIMULATOR_IMAGE:-vyomi/appliance:latest}
    pull_policy: always
    # Root so the simulator can reach the docker-in-docker socket below to
    # launch EC2 instances as sibling containers (the Docker compute backend).
    user: "0:0"
    ports:
      - "9000:9000"
    networks: [vyomi-net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - vyomi-sql-postgres
    environment:
      CLOUDLEARN_STATE_FILE: /data/cloudlearn_state.sqlite3
      CLOUDLEARN_LICENSE_BACKEND_URL: ${VYOMI_LICENSE_BACKEND_URL:-https://vyomi.cloud}
      # Docker compute backend — EC2 instances launch as sibling Docker
      # containers on the Codespace's docker-in-docker daemon (no LXD/Multipass).
      # Unlicensed default = Free tier → 1 VM + 1 RDS + 1 bucket per space (enough
      # for a smoke test); activate Pro (device flow) for 10 VMs.
      VYOMI_COMPUTE_BACKEND: ${VYOMI_COMPUTE_BACKEND:-docker}
      VYOMI_INSTANCE_IMAGE: ${VYOMI_INSTANCE_IMAGE:-vyomi/instance:ubuntu-24.04}
      VYOMI_INSTANCE_NETWORK: vyomi-net
      VYOMI_PROFILE: ${VYOMI_PROFILE:-aws-core}
      # Developer mode → open CORS; the SPA calls /api/* relative so it works
      # behind the Codespaces *.app.github.dev proxy unchanged.
      CLOUDLEARN_DISTRIBUTION_MODE: developer
      # Forwarded public URL (computed by boot.sh from $CODESPACE_NAME) — wins
      # for GCP self-links/URIs. Empty locally → dynamic Host capture takes over.
      CLOUDLEARN_PUBLIC_URL: ${CLOUDLEARN_PUBLIC_URL:-}
      # Pre-seeded enterprise license (org Codespaces secret) — optional; when
      # absent the console uses the device-flow activation.
      VYOMI_LICENSE_JWT: ${VYOMI_LICENSE_JWT:-}
      # Stable per-codespace install id so telemetry + cost meter share a key.
      VYOMI_INSTALL_ID: ${CODESPACE_NAME:-vyomi-sandbox}
      # aws-core backends
      CLOUDLEARN_SQL_PG_HOST: vyomi-sql-postgres
      CLOUDLEARN_SQL_PG_PORT: "5432"
      CLOUDLEARN_SQL_PG_ADMIN_USER: postgres
      CLOUDLEARN_SQL_PG_ADMIN_PASSWORD: cloudlearn
      CLOUDLEARN_MINIO_URL: http://vyomi-minio:9000
      CLOUDLEARN_MINIO_ACCESS_KEY: cloudlearn
      CLOUDLEARN_MINIO_SECRET_KEY: cloudlearn-dev-secret-key
      CLOUDLEARN_DYNAMODB_URL: http://vyomi-dynamodb:8000
      CLOUDLEARN_ELASTICMQ_URL: http://vyomi-elasticmq:9324
      CLOUDLEARN_VAULT_URL: http://vyomi-vault:8200
      CLOUDLEARN_VAULT_TOKEN: vyomi-dev-token
    volumes:
      - vyomi-data:/data
      # Drive the Codespace's docker-in-docker daemon to launch EC2 instances.
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${VYOMI_DOCKER_GID:-0}"
    tmpfs:
      - /tmp:size=100M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

  vyomi-sql-postgres:
    image: postgres:16-alpine
    networks: [vyomi-net]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cloudlearn
    volumes:
      - vyomi-sql-pg:/var/lib/postgresql/data
    restart: unless-stopped

  vyomi-minio:
    image: minio/minio:latest
    networks: [vyomi-net]
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: cloudlearn
      MINIO_ROOT_PASSWORD: cloudlearn-dev-secret-key
    volumes:
      - vyomi-minio:/data
    restart: unless-stopped

  vyomi-dynamodb:
    image: amazon/dynamodb-local:latest
    networks: [vyomi-net]
    restart: unless-stopped

  vyomi-elasticmq:
    image: softwaremill/elasticmq-native:latest
    networks: [vyomi-net]
    restart: unless-stopped

  vyomi-vault:
    image: hashicorp/vault:1.15
    networks: [vyomi-net]
    command: ["server", "-dev", "-dev-root-token-id=vyomi-dev-token", "-dev-listen-address=0.0.0.0:8200"]
    cap_add: [IPC_LOCK]
    restart: unless-stopped

volumes:
  vyomi-data:
  vyomi-sql-pg:
  vyomi-minio:
